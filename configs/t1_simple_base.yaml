# Shared defaults inherited by the current simple_v2 configuration.
data:
  dataset_root: datasets/signatures
  benchmark_root: datasets/protocols/t1
  t2_benchmark_root: null
  fold: 0
  input_pipeline: legacy_v1
  image_height: 256
  image_width: 512
  image_margin: 12
  image_line_width: 2
  image_supersample: 2
  image_speed_cap_mm_s: 800.0
  raw_time_scale_seconds: 60.0
  raw_position_scale_mm: 100.0
  max_points: 6144
  verify_hashes: false
  cache_images: true
  image_cache_root: datasets/cache/t1/rendered_png
  memory_cache: true
  memory_cache_items: 256
  num_workers: 4
  train_episode_fraction: 1.0
  train_subset_seed: 4204
model:
  variant: v5r1
  t1_variant: simple_v1
  t1_pair_features: diff_product
  t1_set_aggregation: sorted_mlp
  t1_sequence_residual: false
  t1_pair_stabilize: false
  feature_dim: 10
  sequence_stem: legacy_stride8
  sequence_model_tokens: 128
  hidden_dim: 256
  conformer_layers: 6
  conformer_heads: 8
  conformer_ffn: 1024
  conformer_kernel: 31
  sequence_tokens: 32
  local_tokens: 16
  dropout: 0.1
  image_backbone: convnext_tiny
  pretrained: true
  fusion: ms_caf
  use_tsa: true
  use_qrsa: false
  use_t1_residual_verification: false
  use_t1_evidence_anchor: false
  use_pim: true
  use_ocsr: true
  sinkhorn_iters: 12
  sinkhorn_epsilon: 0.08
  image_chunk_size: 12
  stateful_prefix_sizes:
  - 1
  - 2
  - 4
  - 8
  t2_adapter_bottleneck: 32
  t2_relation_energy_enabled: false
  t2_null_source_enabled: false
train:
  seed: 42
  stage_a_epochs: 10
  stage_a_selection_policy: dual_t1
  stage_a_evaluate_test_each_epoch: false
  stage_a_finalize_test: false
  stage_a_stop_on_validation_decline: false
  stage_a_test_target_1v1_accuracy: null
  stage_a_test_target_1v1_eer: null
  stage_a_test_target_5v1_accuracy: null
  stage_a_test_target_5v1_eer: null
  stage_b_epochs: 40
  stage_b_workers_per_loader: null
  batch_t1_1v1: 32
  batch_t1_5v1: 8
  batch_t2: 2
  t2_unknown_fraction: 0.5
  t1_balance_strata: false
  grad_accumulation: 4
  stage_a_batch_t1_1v1: 32
  stage_a_batch_t1_5v1: 8
  stage_a_grad_accumulation: 2
  eval_batch_multiplier: 4
  backbone_lr: 5.0e-06
  encoder_lr: 2.0e-05
  head_lr: 0.0002
  weight_decay: 0.0001
  warmup_fraction: 0.05
  grad_clip: 1.0
  patience: 3
  amp: true
  t1_genuine_identity_only: false
  pcgrad: false
  t2_loss: open_set_v5
  selection_policy: source_retrieval_v5
  reshuffle_on_cycle: true
  stage_b_train_t1: false
  stage_b_freeze_encoder: true
  stage_b_unfreeze_late_encoder: true
  t2_encoder_trainability: full
  t2_copy_encoder_from_t1: true
  t2_freeze_inactive_modalities: false
  t2_freeze_inactive_relation_modules: false
  t2_pair_source_absent: true
  stage_b_strict_t1_isolation: false
  t2_counterfactual_pairs: false
  t2_pair_margin: 0.5
  t2_pair_loss_weight: 0.5
  t2_release_warmup_epochs: 2
  t2_release_epochs: 6
  t2_rank_phase_epochs: 0
  t2_open_phase_epochs: 0
  t2_query_loss_weight: 0.5
  t2_monotonic_loss_weight: 0.5
  t2_stateful_loss_weight: 0.75
  t2_arrival_loss_weight: 0.25
  t2_representation_phase_epochs: 0
  t2_unified_phase_epochs: 0
  t2_head_warmup_epochs: 0
  t2_balanced_a_enabled: false
  t2_a_pretrain_epochs: 0
  t2_a_patience: 3
  batch_t2_a: 8
  t2_a_grad_accumulation: 1
  t2_a_loss_weight: 1.0
  t2_a_max_balanced_accuracy_drop: 0.02
  t2_a_min_class_recall: 0.2
  t2_balanced_b_enabled: false
  t2_factor_b_evaluation_enabled: false
  t2_b_pretrain_epochs: 0
  t2_b_patience: 2
  batch_t2_b: 1
  t2_b_grad_accumulation: 8
  t2_b_loss_weight: 1.0
  t2_b_max_balanced_accuracy_drop: 0.02
  t2_b_min_class_recall: 0.2
  t2_initialization_checkpoint: null
  t2_scratch_from_stage_a: false
  t2_adapter_distillation_steps: 0
  t2_adapter_global_distillation_weight: 1.0
  t2_adapter_local_distillation_weight: 0.5
  t2_adapter_internal_distillation_weight: 0.0
  t2_adapter_min_rank_1: 0.0
  t2_adapter_min_rank_3: 0.0
  t2_adapter_reconstruction_tolerance_samples: 0
  t2_relation_distillation_epochs: 0
  t2_rank_recovery_epochs: 0
  t2_distillation_temperature: 2.0
  t2_rank_distillation_weight: 0.0
  t2_hard_negative_loss_weight: 0.0
  t2_b_distillation_weight: 0.0
  unified_joint_loss_weight: 1.0
  unified_bridge_loss_weight: 0.1
  unified_official_loss_weight: 0.2
  unified_factor_a_loss_weight: 0.0
  unified_factor_b_loss_weight: 0.0
  unified_rank_loss_weight: 0.0
  unified_rank_margin_loss_weight: 0.0
  unified_t1_max_eer_increase: 0.01
  evaluate_test_each_epoch: false
  checkpoint_gate_warmup_epochs: 10
  checkpoint_min_hierarchical_accuracy: 0.5
  checkpoint_min_rank_1: 0.303125
  checkpoint_min_rank_3: 0.0
  checkpoint_min_source_absent_accuracy: 0.296875
  checkpoint_min_rf_accuracy: 0.95
  checkpoint_require_bayesian_improvement: false
  checkpoint_factor_gates_enabled: true
  output_dir: models/simple_v1/runs/seed_42
