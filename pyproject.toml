[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dvsrc"
version = "0.1.0"
description = "Writer-disjoint T1/T2 online signature benchmark and DVSR-Net"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=10",
  "PyYAML>=6",
  "scipy>=1.10",
  "torch>=2.2",
  "torchvision>=0.17",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dvsrc = "dvsrc.cli:main"

[tool.setuptools.packages.find]
include = ["dvsrc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
