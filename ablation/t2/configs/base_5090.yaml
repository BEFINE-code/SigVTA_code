# Self-contained active configuration; historical source remains archived.
data:
  dataset_root: datasets/signatures
  benchmark_root: datasets/protocols/t2
  fold: 0
  image_height: 256
  image_width: 512
  max_points: 6144
  verify_hashes: false
  cache_images: true
  memory_cache: true
  num_workers: 8
  train_episode_fraction: 1.0
  train_subset_seed: 4204
  memory_cache_items: 1024
  image_cache_root: datasets/cache/t1/rendered_png
  t2_benchmark_root: datasets/protocols/t2
model:
  hidden_dim: 256
  conformer_layers: 6
  conformer_heads: 8
  conformer_ffn: 1024
  conformer_kernel: 31
  sequence_tokens: 32
  local_tokens: 16
  image_backbone: convnext_tiny
  pretrained: true
  fusion: ms_caf
  use_tsa: true
  use_qrsa: true
  use_pim: true
  use_ocsr: true
  sinkhorn_iters: 12
  sinkhorn_epsilon: 0.08
  image_chunk_size: 12
  variant: t2_abc_v1
  t1_variant: v5r1
train:
  seed: 42
  stage_a_epochs: 0
  stage_b_epochs: 16
  batch_t1_1v1: 32
  batch_t1_5v1: 8
  batch_t2: 8
  t2_unknown_fraction: 0.5
  grad_accumulation: 1
  stage_a_batch_t1_1v1: 8
  stage_a_batch_t1_5v1: 2
  stage_a_grad_accumulation: 8
  eval_batch_multiplier: 2
  backbone_lr: 5.0e-06
  encoder_lr: 2.0e-05
  head_lr: 0.0002
  weight_decay: 0.0001
  warmup_fraction: 0.05
  grad_clip: 1.0
  patience: 6
  amp: true
  pcgrad: false
  output_dir: ablation/t2/runs/_must_be_overridden
  t2_loss: conditional_abc_v1
  selection_policy: unified_abc_v14
  reshuffle_on_cycle: true
  stage_b_train_t1: false
  stage_b_freeze_encoder: true
  stage_a_selection_policy: dual_t1
  stage_b_unfreeze_late_encoder: false
  t2_pair_source_absent: true
  t1_balance_strata: false
  t2_head_warmup_epochs: 2
  stage_b_strict_t1_isolation: true
  t2_counterfactual_pairs: true
  checkpoint_gate_warmup_epochs: 2
  t2_initialization_checkpoint: null
  t2_balanced_a_enabled: true
  t2_a_pretrain_epochs: 8
  t2_a_patience: 3
  batch_t2_a: 8
  t2_a_grad_accumulation: 1
  t2_a_loss_weight: 1.0
  t2_a_max_balanced_accuracy_drop: 0.02
  t2_a_min_class_recall: 0.9
  t2_balanced_b_enabled: true
  t2_b_pretrain_epochs: 4
  t2_b_patience: 2
  batch_t2_b: 8
  t2_b_grad_accumulation: 1
  t2_b_loss_weight: 1.0
  t2_b_max_balanced_accuracy_drop: 0.02
  t2_b_min_class_recall: 0.35
  t2_pair_loss_weight: 0.25
  checkpoint_min_rank_1: 0.47
  checkpoint_min_rank_3: 0.82
  evaluate_test_each_epoch: false
  stage_b_workers_per_loader: 4
  unified_joint_loss_weight: 0.4
  unified_official_loss_weight: 0.0
  unified_factor_a_loss_weight: 0.05
  unified_factor_b_loss_weight: 0.5
  unified_rank_loss_weight: 1.5
  unified_rank_margin_loss_weight: 0.5
  t2_encoder_trainability: full
  t2_copy_encoder_from_t1: true
  t2_freeze_inactive_modalities: true
  t2_freeze_inactive_relation_modules: true
  t2_factor_b_evaluation_enabled: true
  checkpoint_factor_gates_enabled: false
